[project]
name = "retrosheetpy"
dynamic = ["version"]
description = "Fast, modular, and strongly-typed Retrosheet baseball data downloader, parser, and database ingestor."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "COPYING-chadwick"]
requires-python = ">=3.11"
authors = [{ name = "C. B. Winslow" }]
keywords = ["baseball", "retrosheet", "sabermetrics", "chadwick", "duckdb", "parquet", "play-by-play", "dlt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]

dependencies = [
  "chadwickpy>=0.4.0",
  "pyarrow>=14.0.0",
  "duckdb>=1.0.0",
  "httpx>=0.25.0",
  "rich>=13.0.0",
  "click>=8.1.0",
]

[project.optional-dependencies]
polars = ["polars>=1.0.0"]
pandas = ["pandas>=2.0.0"]
dlt = ["dlt[duckdb,postgres,snowflake]>=1.0.0"]
all = [
  "retrosheetpy[polars,pandas,dlt]",
]

[project.urls]
Homepage = "https://github.com/cbwinslow/retrosheetpy"
Source = "https://github.com/cbwinslow/retrosheetpy"
Issues = "https://github.com/cbwinslow/retrosheetpy/issues"
Changelog = "https://github.com/cbwinslow/retrosheetpy/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.100.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.25.0",
  "mkdocs-minify-plugin>=0.8.0",
]

[project.scripts]
retrosheetpy = "retrosheetpy.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/retrosheetpy"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "NOTICE", "COPYING-chadwick", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["retrosheetpy"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
strict = true
files = ["src"]
ignore_missing_imports = true
disallow_untyped_decorators = false
