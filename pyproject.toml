[project]
name = "retrosheetpy"
dynamic = ["version"]
description = "Download Retrosheet seasons, cache them, and turn them into data tables with the Chadwick tools. Pure Python, no compiler needed."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE", "COPYING-chadwick"]
requires-python = ">=3.11"
dependencies = ["chadwickpy>=0.1.1"]
authors = [{ name = "C. B. Winslow" }]
keywords = ["baseball", "retrosheet", "chadwick", "play-by-play", "sabermetrics", "data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/cbwinslow/retrosheetpy"
Source = "https://github.com/cbwinslow/retrosheetpy"
Issues = "https://github.com/cbwinslow/retrosheetpy/issues"
Changelog = "https://github.com/cbwinslow/retrosheetpy/blob/main/CHANGELOG.md"

[project.scripts]
retrosheetpy = "retrosheetpy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff", "mypy", "coverage"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/retrosheetpy"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE", "NOTICE", "COPYING-chadwick", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
