schema: spec-driven

context: |
  Read openspec/project.md first (constitution), AGENTS.md, and CLAUDE.md.
  retrosheetpy is an automated, decoupled Python library and CLI for downloading,
  caching, parsing, and ingesting Retrosheet baseball data (play-by-play events via
  chadwickpy, game logs, rosters, ballparks, player bio registry, transactions,
  and schedules). It produces strongly-typed schemas (PyArrow, DuckDB, Polars,
  Parquet, CSV, and optional dlt destinations), avoiding generic text dumps.

rules:
  design:
    - Keep Extract, Parse, and Sink stages decoupled via Protocols/interfaces.
    - Always define explicit data types (integers, dates, booleans, categoricals), never raw untyped strings.
    - Record architectural decisions in docs/DECISIONS.md.
  tasks:
    - Write unit/contract tests for schemas and loaders before implementation.
    - Test large-scale season downloads and multi-decade ingestion against cbwsff1 test box.
